<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuMind | Knowledge Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      :root {
        --sidebar-width: 300px;
        --primary-color: #2c3e50;
        --accent-color: #3498db;
      }

      body {
        background-color: #f0f2f5;
        display: flex;
        height: 100vh;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
      }

      /* ── Sidebar ── */
      #sidebar {
        width: var(--sidebar-width);
        background: var(--primary-color);
        color: white;
        padding: 24px 20px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #sidebar h4 {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      #sidebar .section-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 1px;
        margin-top: 8px;
      }

      #uploadStatus {
        font-size: 0.82rem;
        min-height: 20px;
        margin-top: 4px;
      }

      /* FIX #13: New Chat button styled and visible */
      #newChatBtn {
        margin-top: auto;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        transition: background 0.2s;
      }
      #newChatBtn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: white;
      }

      /* ── Main Content ── */
      #main-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        min-width: 0;
      }

      #chat-window {
        flex-grow: 1;
        background: white;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        padding: 24px;
        overflow-y: auto;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Messages ── */
      .msg {
        padding: 12px 18px;
        border-radius: 16px;
        max-width: 78%;
        line-height: 1.55;
        font-size: 0.93rem;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .user-msg {
        background: var(--accent-color);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }

      .ai-msg {
        background: #f1f3f5;
        color: #222;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      .ai-msg.error {
        background: #fff0f0;
        color: #c0392b;
        border: 1px solid #f5c6cb;
      }

      /* Typing indicator */
      .typing-indicator {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 14px 18px;
        background: #f1f3f5;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        align-self: flex-start;
        max-width: 80px;
      }
      .typing-indicator span {
        width: 8px;
        height: 8px;
        background: #aaa;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }
      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
        }
      }

      /* ── Input Bar ── */
      #input-bar {
        display: flex;
        gap: 8px;
      }

      #userInput {
        border-radius: 24px;
        padding: 10px 18px;
        border: 1px solid #dee2e6;
        font-size: 0.93rem;
        flex-grow: 1;
      }

      #userInput:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
      }

      #sendBtn {
        border-radius: 24px;
        padding: 10px 22px;
        font-weight: 600;
        background: var(--accent-color);
        border: none;
      }

      #sendBtn:disabled {
        background: #adb5bd;
      }

      .spinner-border {
        width: 0.9rem;
        height: 0.9rem;
        border-width: 2px;
      }
    </style>
  </head>
  <body>
    <!-- ── Sidebar ── -->
    <div id="sidebar">
      <h4><i class="bi bi-layers-half me-2"></i>DocuMind</h4>
      <hr class="border-secondary" />

      <p class="section-label">Upload Document</p>

      <input
        type="file"
        id="fileInput"
        class="form-control form-control-sm"
        accept=".pdf"
      />

      <button
        onclick="uploadFile()"
        class="btn btn-primary btn-sm w-100 mt-1"
        id="uploadBtn"
      >
        <i class="bi bi-cloud-arrow-up me-1"></i> Upload & Analyze
      </button>

      <div id="uploadStatus"></div>

      <!-- FIX #13: New Chat button now wired to /new_chat endpoint -->
      <button onclick="newChat()" class="btn btn-sm w-100" id="newChatBtn">
        <i class="bi bi-plus-circle me-1"></i> New Chat
      </button>
    </div>

    <!-- ── Main Content ── -->
    <div id="main-content">
      <div id="chat-window">
        <div class="ai-msg msg">
          👋 Welcome to <strong>DocuMind</strong>! Upload a PDF research paper
          or resume using the sidebar to begin analysis.
        </div>
      </div>

      <div id="input-bar">
        <input
          type="text"
          id="userInput"
          placeholder="Ask a question about the document..."
          onkeydown="if (event.key === 'Enter') askQuestion();"
        />
        <button onclick="askQuestion()" class="btn btn-primary" id="sendBtn">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>

    <script>
      // ── Helpers ──────────────────────────────────────────────────────────────

      function appendMessage(text, type) {
        const chat = document.getElementById("chat-window");
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function appendHTML(html, type) {
        const chat = document.getElementById("chat-window");
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function showTyping() {
        const chat = document.getElementById("chat-window");
        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.id = "typingIndicator";
        indicator.innerHTML = "<span></span><span></span><span></span>";
        chat.appendChild(indicator);
        chat.scrollTop = chat.scrollHeight;
      }

      function removeTyping() {
        const el = document.getElementById("typingIndicator");
        if (el) el.remove();
      }

      // ── Upload ───────────────────────────────────────────────────────────────
      async function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        const btn = document.getElementById("uploadBtn");
        const status = document.getElementById("uploadStatus");

        const file = fileInput.files[0];

        if (!file) {
          status.innerHTML = `<span class="text-warning">⚠️ Please select a PDF file first.</span>`;
          return;
        }

        if (!file.name.toLowerCase().endsWith(".pdf")) {
          status.innerHTML = `<span class="text-danger">❌ Only PDF files are supported.</span>`;
          return;
        }

        btn.disabled = true;
        status.innerHTML = `<span class="text-info"><span class="spinner-border spinner-border-sm me-1"></span> Uploading...</span>`;

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });
          const result = await response.json();

          if (response.status === 202 && result.job_id) {
            // Background processing started — poll for completion
            status.innerHTML = `<span class="text-info"><span class="spinner-border spinner-border-sm me-1"></span> Analyzing document...</span>`;
            pollUploadStatus(result.job_id, file.name, btn, status);
          } else if (result.error) {
            status.innerHTML = `<span class="text-danger">❌ ${result.error}</span>`;
            btn.disabled = false;
          } else {
            status.innerHTML = `<span class="text-danger">❌ Upload failed. Please try again.</span>`;
            btn.disabled = false;
          }
        } catch (err) {
          status.innerHTML = `<span class="text-danger">❌ Network error. Please try again.</span>`;
          btn.disabled = false;
        }
      }

      function pollUploadStatus(jobId, fileName, btn, status) {
        const interval = setInterval(async () => {
          try {
            const response = await fetch("/upload_status/" + jobId);
            const data = await response.json();

            if (data.status === "done") {
              clearInterval(interval);
              status.innerHTML = `<span class="text-success">${data.message}</span>`;
              appendHTML(
                `📄 <strong>${fileName}</strong> has been analyzed. What would you like to know?`,
                "ai-msg",
              );
              btn.disabled = false;
            } else if (data.status === "error") {
              clearInterval(interval);
              status.innerHTML = `<span class="text-danger">❌ ${data.message}</span>`;
              btn.disabled = false;
            }
            // if "processing" — keep polling
          } catch (err) {
            clearInterval(interval);
            status.innerHTML = `<span class="text-danger">❌ Status check failed. Please try again.</span>`;
            btn.disabled = false;
          }
        }, 3000); // poll every 3 seconds
      }

      // ── Chat ─────────────────────────────────────────────────────────────────

      async function askQuestion() {
        const input = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const question = input.value.trim();
        if (!question) return;

        appendMessage(question, "user-msg");
        input.value = "";
        sendBtn.disabled = true;
        showTyping();

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // FIX #6: Always sends valid JSON
            body: JSON.stringify({ question }),
          });

          removeTyping();
          const result = await response.json();

          if (result.answer) {
            appendMessage(result.answer, "ai-msg");
          } else {
            appendMessage(
              "Something went wrong. Please try again.",
              "ai-msg error",
            );
          }
        } catch (err) {
          removeTyping();
          appendMessage(
            "Network error. Please check your connection and try again.",
            "ai-msg error",
          );
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      // ── New Chat ──────────────────────────────────────────────────────────────
      // FIX #13: This function was missing entirely — now wired to the button

      async function newChat() {
        const btn = document.getElementById("newChatBtn");
        btn.disabled = true;

        try {
          const response = await fetch("/new_chat", { method: "POST" });
          const result = await response.json();

          // Clear the UI
          const chat = document.getElementById("chat-window");
          chat.innerHTML = `<div class="ai-msg msg">🆕 Session cleared. Upload a new document to begin.</div>`;

          // Reset sidebar
          document.getElementById("fileInput").value = "";
          document.getElementById("uploadStatus").innerHTML = "";
        } catch (err) {
          appendMessage(
            "Could not clear session. Please refresh the page.",
            "ai-msg error",
          );
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
