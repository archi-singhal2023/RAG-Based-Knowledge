<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriRoad AI | Knowledge Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      :root {
        --sidebar-width: 300px;
        --primary-color: #2c3e50;
      }
      body {
        background-color: #f8f9fa;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #sidebar {
        width: var(--sidebar-width);
        background: var(--primary-color);
        color: white;
        padding: 20px;
        flex-shrink: 0;
      }
      #main-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }
      #chat-window {
        flex-grow: 1;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 20px;
        overflow-y: auto;
        margin-bottom: 20px;
      }
      .msg {
        margin-bottom: 15px;
        padding: 12px 18px;
        border-radius: 15px;
        max-width: 80%;
      }
      .user-msg {
        background: #007bff;
        color: white;
        align-self: flex-end;
        margin-left: auto;
      }
      .ai-msg {
        background: #e9ecef;
        color: #333;
        align-self: flex-start;
      }
      .spinner-border {
        width: 1rem;
        height: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h4><i class="bi bi-layers-half"></i> TriRoad AI</h4>
      <hr />
      <p class="small text-uppercase fw-bold text-muted">Document Control</p>
      <input
        type="file"
        id="fileInput"
        class="form-control form-control-sm mb-2"
      />
      <button
        onclick="uploadFile()"
        class="btn btn-primary btn-sm w-100 mb-3"
        id="uploadBtn"
      >
        <i class="bi bi-cloud-arrow-up"></i> Upload Document
      </button>
      <div id="uploadStatus" class="small mt-2"></div>
    </div>

    <div id="main-content">
      <div id="chat-window" class="d-flex flex-column">
        <div class="ai-msg msg">
          Welcome! Upload a research paper or resume to begin analysis.
        </div>
      </div>
      <div class="input-group">
        <input
          type="text"
          id="userInput"
          class="form-control"
          placeholder="Ask about the document..."
        />
        <button onclick="askQuestion()" class="btn btn-primary" id="sendBtn">
          Send
        </button>
      </div>
    </div>

    <script>
      async function uploadFile() {
        const btn = document.getElementById("uploadBtn");
        const status = document.getElementById("uploadStatus");
        btn.disabled = true;
        status.innerHTML = `<span class="spinner-border"></span> Processing...`;

        const formData = new FormData();
        formData.append("file", document.getElementById("fileInput").files[0]);

        const response = await fetch("/upload", {
          method: "POST",
          body: formData,
        });
        const result = await response.json();
        status.innerHTML =
          result.message || `<span class="text-danger">${result.error}</span>`;
        btn.disabled = false;
      }

      async function askQuestion() {
        const input = document.getElementById("userInput");
        const chat = document.getElementById("chat-window");
        const question = input.value;
        if (!question) return;

        chat.innerHTML += `<div class="msg user-msg">${question}</div>`;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question }),
        });
        const result = await response.json();
        chat.innerHTML += `<div class="msg ai-msg">${result.answer}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
