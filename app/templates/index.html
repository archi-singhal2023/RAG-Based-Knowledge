<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuMind | Knowledge Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- ── Sidebar ── -->
    <div id="sidebar">
      <h4><i class="bi bi-layers-half me-2"></i>DocuMind</h4>
      <hr class="border-secondary" />

      <p class="section-label">Upload Document</p>

      <input
        type="file"
        id="fileInput"
        class="form-control form-control-sm"
        accept=".pdf"
      />

      <button
        onclick="uploadFile()"
        class="btn btn-primary btn-sm w-100 mt-1"
        id="uploadBtn"
      >
        <i class="bi bi-cloud-arrow-up me-1"></i> Upload & Analyze
      </button>

      <div id="uploadStatus"></div>

      <!-- FIX #13: New Chat button now wired to /new_chat endpoint -->
      <button onclick="newChat()" class="btn btn-sm w-100" id="newChatBtn">
        <i class="bi bi-plus-circle me-1"></i> New Chat
      </button>
    </div>

    <!-- ── Main Content ── -->
    <div id="main-content">
      <div id="chat-window">
        <div class="ai-msg msg">
          👋 Welcome to <strong>DocuMind</strong>! Upload a PDF research paper
          or resume using the sidebar to begin analysis.
        </div>
      </div>

      <div id="input-bar">
        <input
          type="text"
          id="userInput"
          placeholder="Ask a question about the document..."
          onkeydown="if (event.key === 'Enter') askQuestion();"
        />
        <button onclick="askQuestion()" class="btn btn-primary" id="sendBtn">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
